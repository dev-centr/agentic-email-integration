name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        env:
          AEI_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          AEI_BUILD_ID: ${{ github.sha }}
          AEI_CHANNEL: ci
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: aei-dist
          path: dist/
